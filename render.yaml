services:
  - type: web
    name: egress-backend-api
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python seed_code_clauses.py
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DATABASE_URL
        sync: false
      - key: FLS_DATABASE_PATH
        value: data/fls_demo.db
